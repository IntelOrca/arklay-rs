[package]
name = "arklay"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A from-scratch engine for the classic Resident Evil games"
license = "MIT"

[features]
default = ["lua"]
# Sandboxed Lua 5.4 scripting hooks (an optional dependency, so a
# `--no-default-features` build compiles every hook to a no-op).
lua = ["dep:mlua"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
mlua = { version = "0.10", default-features = false, features = [
    "lua54",
    "vendored",
], optional = true }
sdl3-sys = { version = "0.7", default-features = false }
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
sdl3-sys = { version = "0.7", default-features = false, features = ["build-from-source-static"] }

[lints.rust]
warnings = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"

# The release-profile test build: release-speed code without the thin LTO
# link pass, which costs minutes and buys a test binary nothing. Incremental
# compilation keeps the single-test edit loop at a few seconds (CI sets
# CARGO_INCREMENTAL=0; it builds cold anyway). Used by `scripts/check.sh`, CI
# and the documented test commands; shipped binaries keep `[profile.release]`.
[profile.test-release]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
