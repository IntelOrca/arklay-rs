name: Fuzz

on:
  schedule:
    # Weekly, Saturday 04:43 UTC; fuzzing is never a pull-request gate.
    - cron: "43 4 * * 6"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # `rust-toolchain.toml` pins stable and rustup gives it precedence over an
    # installed nightly, so without this override cargo-fuzz's nightly-only
    # `-Zsanitizer=address` build is rejected ("the option `Z` is only accepted
    # on the nightly compiler") and every target fails before it fuzzes
    # anything. `RUSTUP_TOOLCHAIN` outranks the toolchain file.
    env:
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        target:
          - pack
          - manifest
          - rdt
          - scd
          - scd_asm
          - emd
          - tim
          - tmd
          - ivm
          - avi
          - cinepak
          - lzw
          - bmp
          - save
          - mask
          - wav
          - dor
          - lua
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # cargo-fuzz builds the instrumented std with `-Zbuild-std`.
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        # The scratch corpus is the writable one; the committed synthetic
        # seeds stay read-only so a run never dirties the checkout.
        run: |
          mkdir -p corpus/${{ matrix.target }}
          # The gnu target, not cargo-fuzz's musl default: its AddressSanitizer
          # refuses a statically linked libc ("sanitizer is incompatible with
          # statically linked libc"). `sdl-from-source` builds the SDL3 the
          # arklay library links against, since the runner has none.
          cargo fuzz run --target x86_64-unknown-linux-gnu --features sdl-from-source \
            ${{ matrix.target }} corpus/${{ matrix.target }} seeds/${{ matrix.target }} \
            -- -max_total_time=300 -rss_limit_mb=4096
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
