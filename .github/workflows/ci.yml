name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --features sdl3-sys/build-from-source,sdl3-sys/sdl-unix-console-build
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: ./target/release/arklay.exe --version
      - run: Compress-Archive -Path target/release/arklay.exe, README.md, LICENSE -DestinationPath arklay-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: arklay-windows-x86_64
          path: arklay-windows-x86_64.zip
          if-no-files-found: error
