name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo check --no-default-features
      - run: cargo check --manifest-path fuzz/Cargo.toml
      - run: cargo test --features sdl3-sys/build-from-source,sdl3-sys/sdl-unix-console-build
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - run: cargo test --release --features sdl3-sys/build-from-source,sdl3-sys/sdl-unix-console-build
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
      - run: cargo doc --no-deps
      - run: cargo build --release --features sdl3-sys/build-from-source,sdl3-sys/sdl-unix-console-build
      - name: Package the Linux artifact
        run: |
          mkdir -p dist
          cp target/release/arklay README.md LICENSE dist/
          tar -C dist -czf arklay-linux-x86_64.tar.gz .
      - name: Smoke the artifact
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: |
          mkdir -p smoke
          tar -C smoke -xzf arklay-linux-x86_64.tar.gz
          ./smoke/arklay --version
          python3 - <<'PY'
          import struct
          # One zero-length entry named "a".
          toc = struct.pack('<QQQB7x', 10 + 32, 10 + 32 + 2, 0, 0)
          open('smoke/tiny.akpak', 'wb').write(
              b'APAK' + struct.pack('<HI', 1, 1) + toc + b'a\x00')
          PY
          ./smoke/arklay list smoke/tiny.akpak
      - uses: actions/upload-artifact@v4
        with:
          name: arklay-linux-x86_64
          path: arklay-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - run: ./target/release/arklay.exe --version
      - run: Compress-Archive -Path target/release/arklay.exe, README.md, LICENSE -DestinationPath arklay-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: arklay-windows-x86_64
          path: arklay-windows-x86_64.zip
          if-no-files-found: error

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features
      - run: cargo check --no-default-features
