[package]
name = "arklay"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A from-scratch engine for the classic Resident Evil games"
license = "MIT"

[features]
default = ["hd"]
# The replacement-format decoders an HD mod pack needs: PNG and WebP art, OGG
# Vorbis audio and H.264/AAC films. Art and audio are pure-Rust crates; the
# H.264 decoder is Cisco's BSD-licensed OpenH264, built from source by its
# crate (with its SIMD assembly when `nasm` is on the PATH). They are optional,
# so a `--no-default-features` build stays lean; such a build still resolves
# replacements by stem, but cannot decode the formats it does not carry.
hd = [
    "dep:image-webp",
    "dep:lewton",
    "dep:openh264",
    "dep:png",
    "dep:symphonia-codec-aac",
    "dep:symphonia-core",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fontdue = "0.9"
image-webp = { version = "0.2", optional = true }
lewton = { version = "0.10", optional = true }
mlua = { version = "0.10", default-features = false, features = [
    "lua54",
    "vendored",
] }
# 0.9.5 and later depend on `wide` 1.x, which needs a newer rustc than our
# MSRV.
openh264 = { version = "=0.9.3", optional = true }
png = { version = "0.18", optional = true }
sdl3-sys = { version = "0.7", default-features = false }
symphonia-codec-aac = { version = "0.6", optional = true }
symphonia-core = { version = "0.6", default-features = false, optional = true }
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
sdl3-sys = { version = "0.7", default-features = false, features = ["build-from-source-static"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

[lints.rust]
warnings = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# OpenH264 is C++ built by the crate's build script, which follows the
# profile's opt-level; unoptimised it cannot decode an HD film in real time.
[profile.dev.package.openh264-sys2]
opt-level = 3

[profile.release]
lto = "thin"

# The release-profile test build: release-speed code without the thin LTO
# link pass, which costs minutes and buys a test binary nothing. Incremental
# compilation keeps the single-test edit loop at a few seconds (CI sets
# CARGO_INCREMENTAL=0; it builds cold anyway). Used by `scripts/check.sh`, CI
# and the documented test commands; shipped binaries keep `[profile.release]`.
[profile.test-release]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
